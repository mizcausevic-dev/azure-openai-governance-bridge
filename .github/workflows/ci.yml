name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests function_app.py
      - name: Format check
        run: ruff format --check src tests function_app.py
      - name: Type check
        run: mypy src
      - name: Test
        run: pytest -v

  bicep:
    name: validate bicep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Bicep build (syntax + type validation)
        run: az bicep build --file infra/main.bicep
